services:
    postgres:
        image: postgres:17-alpine
        ports:
            - '127.0.0.1:${ORBIUM_DB_PORT:-54329}:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-orbium}
            POSTGRES_USER: ${DB_USERNAME:-orbium}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-orbium} -d ${DB_DATABASE:-orbium}',
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    app:
        build: .
        env_file: .env
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            SESSION_DRIVER: database
            FILESYSTEM_DISK: local
        volumes:
            - app_storage:/var/www/html/storage/app
            - public_assets:/var/www/html/public
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${ORBIUM_PORT:-8080}:80'
        volumes:
            - public_assets:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy

volumes:
    postgres_data:
    app_storage:
    public_assets:
